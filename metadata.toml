citation = "@inproceedings{triprobe2026,\n  title     = {TriProbe: Defending Federated IDS against Composite Backdoors},\n  author    = {Liu, Yifan and Qiu, Junjie and Chai, Wenlei and Liu, Zheng and Liu, Yi},\n  booktitle = {Annual Computer Security Applications Conference (ACSAC)},\n  year      = {2026}\n}"
license_url = "https://opensource.org/license/mit"
infrastructure_constraints = "Verified on Google Colab (free tier, Tesla T4, Python 3.13.15): install.sh completes and claim3 --smoke runs end to end to PIPELINE OK. That smoke run took 1.7 minutes there against 10.5 on our reference machine, so the runtimes quoted in README.txt are a conservative ceiling on a T4.\n\nThe reference measurements themselves were taken on a local workstation GPU (NVIDIA GTX 1650, 4 GB), not on a public platform. This is a practical constraint rather than a technical one: the artifact needs no special hardware, no privileged access, and no site-specific resources. Any CUDA GPU with 4 GB and about 8 GB of host RAM is sufficient; the 4.2 GB peak is host RAM, not GPU memory.\n\nChameleon, CloudLab, FABRIC and SPHERE have not been tested. infrastructure/hardware.md marks those notes as expectations derived from the code's requirements rather than as measurements.\n\nOne Colab-specific note, already handled in install.sh: Debian-derived images package python3-venv separately, so ensurepip is missing and `python -m venv` fails. install.sh detects this, rebuilds with --without-pip and bootstraps pip itself, so no manual step is required."
infrastructure_access = "No private access is required and none is provided. There is no live service, no hosted instance, and no hardware to reach; the artifact is source code that runs anywhere with a CUDA GPU.\n\nEvaluators should clone the repository and run install.sh, which builds a virtualenv and pins dependencies. The only manual step is obtaining the three public datasets, which are not redistributed because each carries its provider's licence terms; infrastructure/datasets.md gives download URLs, the expected directory layout, and row counts to verify a correct download against.\n\nA contact author is reachable through HotCRP for the whole evaluation period."
install_script = "https://github.com/autumnjj12138-oss/TriProbe-for-ACSAC/blob/v1.2-acsac2026/install.sh"
use = "Intended use: reproducing the paper's claims, and reusing the composite-backdoor attack or the triggered-probe defense as a baseline in follow-on work.\n\nNot suitable for: deployment. This simulates federation in a single process. There is no network layer, no authentication, no secure aggregation, and no client-side privacy mechanism. Do not put it in front of real traffic.\n\nReproducibility scope, stated up front because it affects how results should be compared: runs are bit-identical for a fixed seed on a fixed machine, which we verified by repeating one seed three times. They are NOT identical across different GPUs. We verified this too, by checking out the submission commit and running it on different hardware: some numbers reproduced exactly and others moved by more than an order of magnitude, because floating-point differences change which round the server's filter first catches the last attacker. Claims are therefore graded ROBUST or SENSITIVE in use.txt, and the assertions in each run.sh are inequalities with wide margins rather than equality tests.\n\nKnown limitations of the defense itself, all verifiable with this artifact and all stated in the paper: a probe-aware attacker defeats it (claim6); categorical-only triggers are a coverage gap; the false-positive rate roughly triples relative to FedAvg, which is tolerable on CIC-IDS2017 and not on UNSW-NB15; and it tolerates exactly one un-dropped attacker."
destructive = "None. The artifact reads the three datasets, writes training results under results/, and writes a virtualenv under .venv/. It does not modify anything outside its own directory, makes no network connections at run time, requires no elevated privileges, and contains no analytics or tracking of any kind.\n\nThe attack code operates only on the bundled offline datasets. flow_defense/attack_scapy.py can emit a PCAP whose statistics match a trigger, which exists to show a trigger is physically realisable; it transmits nothing and nothing in claims/ imports it."
claim1 = "The cross-subspace composite backdoor defeats published FL backdoor defenses, while TriProbe stops it. Over five seeds on CIC-IDS2017 the weight- and update-geometry defenses (FedMedian, Krum, FLAME, RLR) reach 57.7-73.3% attack success rate, the behavioral detector DeepSight 63.08%, and Lockdown and Flow-Aware Lockdown collapse to 100% with benign accuracy falling to 80.3%, whereas TriProbe holds ASR at 0.86 +/- 0.68%."
script1 = "https://github.com/autumnjj12138-oss/TriProbe-for-ACSAC/blob/v1.2-acsac2026/claims/claim1_main_defense/run.sh"
expected1 = "Every baseline above 40% ASR, TriProbe below the 5% deployment threshold, and at least a 20x separation between them; at --full all eight baselines run with every TriProbe mechanism disabled, as in the configuration that produced the reference values. Reference values and the full assertion list are in claims/claim1_main_defense/expected/expected.json. Budgets differ and so do the absolute numbers: the five-seed --full figure is 0.86 +/- 0.68% against baselines at 57.7-73.3%, while one seed at --quick measures 0.80% against an undefended 33.6%, a 42x separation. Both support the claim, which is about the separation rather than the value. The quick threshold is relaxed to 10x and each run prints which threshold it used."
claim2 = "Two of TriProbe's four components carry the defense. Removing triggered-probe filtering raises ASR from 0.86% to 45.62%, and removing the hard mask-density cap raises it to 100%. Removing Layer-1 cross-subspace blocking or end-of-training consensus fusion changes ASR by 0.20 and 0.04 percentage points respectively."
script2 = "https://github.com/autumnjj12138-oss/TriProbe-for-ACSAC/blob/v1.2-acsac2026/claims/claim2_ablation/run.sh"
expected2 = "Removing either core mechanism must raise ASR by more than 20x, and each auxiliary component must move it by less than 2 percentage points. The two groups differ by more than two orders of magnitude, so the ranking reproduces even where absolute values shift. See claims/claim2_ablation/expected/expected.json."
claim3 = "Mask density has a sharp cliff and the hard cap keeps the system below it. With asymmetric prune and recover rates the density fixed point is alpha_r/(alpha_p+alpha_r) = 0.167, which sits directly on a cliff: the defense is healthy at any cap up to 0.16 and collapses completely at 0.18."
script3 = "https://github.com/autumnjj12138-oss/TriProbe-for-ACSAC/blob/v1.2-acsac2026/claims/claim3_density_cliff/run.sh"
expected3 = "Every cap at or below 0.16 gives ASR under 5%; every cap at or above 0.18 exceeds 95%, with benign accuracy dropping 16 points. A single 0.02 step spans the whole range. This is the cheapest and most decisive claim to check. See claims/claim3_density_cliff/expected/expected.json."
claim4 = "The defense transfers to other IDS datasets with the same hyperparameters. On UNSW-NB15 the composite backdoor is suppressed to 0.06%, and on NSL-KDD the median across five seeds is 0.016%."
script4 = "https://github.com/autumnjj12138-oss/TriProbe-for-ACSAC/blob/v1.2-acsac2026/claims/claim4_cross_dataset/run.sh"
expected4 = "Median composite ASR below 1% on each dataset. Read the NSL-KDD number as a median rather than a mean: four of five seeds land below 0.03% and one reaches 10.17%, so a reviewer running a subset may or may not hit the tail seed, and hitting it is not a reproduction failure. On UNSW-NB15 the run also prints a false-positive rate that rises from 7.84% to 21.50%, which the paper reports as a limitation. NSL-KDD ships as header-less .txt files; convert them once with artifact/scripts/prepare_nslkdd.py. See claims/claim4_cross_dataset/expected/expected.json."
claim5 = "The defense holds against adaptive attackers that do not model the probe: update scaling both norm-bounded (1.14%) and unbounded (0.92%), a white-box split-trigger attacker that knows the architecture (1.46% over three seeds, against 56.88% undefended), and delayed or on-off backdoors that activate late (0.56-1.18%)."
script5 = "https://github.com/autumnjj12138-oss/TriProbe-for-ACSAC/blob/v1.2-acsac2026/claims/claim5_adaptive/run.sh"
expected5 = "TriProbe below 5% in every configuration, including the split-trigger arm (three seeds at --full, one at --quick), and the undefended scaling arm above 70% (40% at --quick) so a run where the attack simply failed to implant is not mistaken for a successful defense. Graded SENSITIVE: our own hardware change moved the scaling number by roughly 7x, so check the assertions rather than the point values. See claims/claim5_adaptive/expected/expected.json."
claim6 = "A probe-aware attacker defeats TriProbe, and this marks the method's applicability boundary. An attacker who suppresses target-class confidence on the server's probe distribution while still implanting the backdoor raises ASR to 45.17%, against 1.78% for a mismatched but non-adaptive probe. Randomized probes, norm clipping, and both together reduce it only to 32.6-35.2%."
script6 = "https://github.com/autumnjj12138-oss/TriProbe-for-ACSAC/blob/v1.2-acsac2026/claims/claim6_probe_evasion/run.sh"
expected6 = "This is a NEGATIVE result and the assertion is inverted: the run PASSES when ASR exceeds 20%, because that is what the paper claims happens. The mismatched-probe arm must stay below 5%, which isolates adaptivity rather than probe mismatch as the cause. At --quick (one seed, 15 rounds) the separation already shows, 39.41% against 0.80%, and the quick assertion is evasion > 20% and > 10x the mismatched arm; the three mitigation arms run only at --full. run.sh prints the attacker's trigger features and the server probe's features, which must not overlap. See claims/claim6_probe_evasion/expected/expected.json."
hw = "One CUDA GPU. The reference machine is an NVIDIA GTX 1650 (4 GB, compute capability 7.5, Turing). GPU memory is not the binding constraint: measured peak torch reservation is 0.09 GB, and device-wide usage rises about 0.13 GB above idle while training, so two runs fit on this 4 GB card at once.\n\nHost RAM is the binding constraint: measured peak resident set is 4.2 GB, almost all of it the pandas frame holding all 2,830,743 CIC-IDS2017 rows before downsampling. That peak is the same at every budget, because the merge happens before the row cap. Plan for 8 GB of RAM; 4 GB is not enough.\n\nAbout 8 GB of disk: roughly 4.5 GB for the virtualenv (the CUDA build of torch accounts for 4.3 GB of it), 0.9 GB for the three datasets as CSV, the 424 KB repository, and room for results.\n\nA CPU-only build is supported by install.sh with CPU_ONLY=1. We did not measure it; from the arithmetic we expect roughly 20x slower, which would make the smoke tier practical and the full tier infeasible."
sw = "Python 3.10 through 3.13. Reference measurements were taken on 3.11.14; the artifact was also verified end to end on Colab's Python 3.13.15, and torch 2.6.0 publishes wheels for cp39 through cp313. Note that Debian-derived images, Colab included, package python3-venv separately, so ensurepip is missing and `python -m venv` fails; install.sh detects this and rebuilds with --without-pip, bootstrapping pip itself, so no manual step is needed. PyTorch 2.6.0+cu126, numpy 2.4.3, pandas 3.0.1, scikit-learn 1.8.0. install.sh creates a virtualenv and installs these pinned versions; the CUDA build index URL can be changed if the evaluator's driver needs a different one.\n\nLinux or Windows. The shell wrappers are POSIX sh and the Python is platform independent. No GUI, no network access at run time, no paid services, no API keys.\n\nscikit-learn must be at least 1.3 because one baseline uses sklearn.cluster.HDBSCAN; the code falls back to AgglomerativeClustering if it is unavailable, which changes that one baseline and is noted in requirements.txt.\n\nThe three datasets are public but not redistributed: CIC-IDS2017, UNSW-NB15 and NSL-KDD, each obtained from its provider under that provider's terms. infrastructure/datasets.md gives URLs, layout, and row counts to verify against."
api = "None. The artifact makes no network connections at run time and requires no API keys, accounts, or paid services."
